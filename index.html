<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Stages &amp; Alternances</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">S&amp;A</span>
            <span class="brand-name">Portail Stages &amp; Alternances</span>
        </div>
        <nav class="top-nav">
            <a href="#" class="active">Offres</a>
            <a href="./offres-suivies.html">Suivies</a>
            <a href="./deposer-offre.html">Déposer</a>
            <a href="admin/dashboard.html">Admin</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-eyebrow">PROMOTION MERN 2026/2027</div>
        <h1>Trouvez votre stage ou alternance</h1>
        <p id="total-count-text">Chargement des offres...</p>
    </section>

    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Titre, entreprise, description...">

        <select class="filter-select" id="type-filter">
            <option value="">Tout type</option>
            <option value="Stage">Stage</option>
            <option value="Alternance">Alternance</option>
        </select>

        <select class="filter-select" id="city-filter">
            <option value="">Toutes villes</option>
            <option value="Casablanca">Casablanca</option>
            <option value="Rabat">Rabat</option>
            <option value="Kénitra">Kénitra</option>
            <option value="Tanger">Tanger</option>
        </select>

        <select class="filter-select" id="tech-filter">
            <option value="">Toutes techs</option>
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
            <option value="Laravel">Laravel</option>
            <option value="PHP">PHP</option>
            <option value="MySQL">MySQL</option>
        </select>

        <select class="filter-select" id="sort-filter">
            <option value="">Trier par</option>
            <option value="recent">Plus récentes</option>
            <option value="oldest">Plus anciennes</option>
        </select>
    </div>

    <main class="listings" id="listings"></main>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
