<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offres suivies — Portail Stages &amp; Alternances</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-body">

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">S&amp;A</span>
            <span class="brand-name">Portail Stages &amp; Alternances</span>
        </div>
        <nav class="top-nav">
            <a href="index.html">Offres</a>
            <a href="offres-suivies.html" class="active">Suivies</a>
            <a href="./deposer-offre.html">Déposer</a>
            <a href="/admin/dashboard.html">Admin</a>
        </nav>
    </header>

    <div class="page suivies-page">
        <h1>Offres suivies</h1>
        <p class="page-sub" id="suivies-count">Chargement...</p>
        <div class="followed-grid" id="listings"></div>
    </div>

    <script type="module">
import { getData } from './js/data.js';
import { getFollowedIds } from './js/storage.js';
import { renderOffers } from './js/render.js';

async function initSuiviesPage() {
    const countText = document.getElementById('suivies-count');
    
    const allOffres = await getData();
    
    function updatePage() {
        const followedIds = getFollowedIds().map(id => Number(id));
        const suiviOffres = allOffres.filter(offer => followedIds.includes(Number(offer.id)));

        if (countText) {
            const count = suiviOffres.length;
            countText.textContent = `${count} offre${count > 1 ? 's' : ''} enregistrée${count > 1 ? 's' : ''} dans ce navigateur`;
        }
        
        renderOffers(suiviOffres, updatePage);
    }

    updatePage();
}

initSuiviesPage();
    </script>
</body>

</html>
